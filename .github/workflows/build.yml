name: Build GTA Extreme Launcher V0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract launcher ZIP
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Launcher ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source

      - name: Build Android APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Extreme-Launcher-V0.2
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
